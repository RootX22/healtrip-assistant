name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healtrip"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Runs the repository tests against Postgres as well as the in-memory store.
      DATABASE_URL: postgres://postgres:test@localhost:5432/healtrip
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
