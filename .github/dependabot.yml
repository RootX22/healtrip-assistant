version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports a new TypeScript major some time after it
      # ships, so that upgrade is made by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types describe the Node runtime, which stays on the 24 LTS line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
    ignore:
      # Stay on the Node LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
